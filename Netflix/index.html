<!doctype html><html><head><meta charset="utf-8">
    <title>My Favourite Movies</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet">
    <style>
        body { --primary: #6200ee; --primary-dark: #4a00b8; --danger: #c62828; --bg: #f5f3fa; margin: 0px; background: var(--bg); }
        * {font-family: 'Roboto', sans-serif; box-sizing: border-box;}
        button {
            -webkit-font-smoothing: antialiased;
            display: inline-block;
            margin: 2px;
            color: var(--primary);
            background: white;
            border: 1px solid var(--primary);
            border-radius: 4px;
            height: 30px;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            transition: ease-in 0.2s all;
            padding: 0 14px;
        }
        button:hover { background: var(--primary); color: white; }
        button.delete { color: var(--danger); border-color: var(--danger); }
        button.delete:hover { background: var(--danger); color: white; }
        button.update, button.create, button.new { background: var(--primary); color: white; }
        button.update:hover, button.create:hover, button.new:hover { background: var(--primary-dark); }

        h1 { background: var(--primary); color: white; font-weight: 300; text-transform: uppercase; font-size: 22px; margin: 0px; padding: 18px 24px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
        h2 { margin: 0 0 16px 0; font-size: 22px; color: var(--primary); }
        div#main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }

        div.toolbar { margin-bottom: 18px; display: flex; gap: 6px; align-items: center; }
        div.toolbar .count { margin-left: auto; color: #666; font-size: 13px; }
        div.movies { display: flex; flex-wrap: wrap; gap: 18px; }
        div.movie { width: 220px; padding: 10px; background: white; border-radius: 6px; box-shadow: 2px 2px 8px #ccc; transition: transform .15s; }
        div.movie:hover { transform: translateY(-3px); }
        div.movie div.movie-img { width: 100%; height: 300px; overflow: hidden; border-radius: 4px; background: #eee; cursor: pointer; }
        div.movie div.movie-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        div.movie div.title { text-align: center; overflow: hidden; text-overflow: ellipsis; width: 100%; white-space: nowrap; margin-top: 8px; font-size: 17px; }
        div.movie div.actions { margin-top: 8px; text-align: center; white-space: nowrap; }
        div.movie div.actions button { padding: 0 8px; margin: 2px 1px; }
        div.empty { padding: 40px; text-align: center; color: #666; background: white; border-radius: 6px; }

        div.card { background: white; border-radius: 6px; box-shadow: 2px 2px 8px #ccc; padding: 24px; max-width: 760px; }
        div.detail { display: flex; gap: 24px; flex-wrap: wrap; }
        div.detail img { width: 240px; height: 340px; object-fit: cover; border-radius: 4px; box-shadow: 2px 2px 8px #ccc; }
        div.detail div.info { flex: 1; min-width: 220px; }
        div.detail p { margin: 0 0 14px 0; font-size: 18px; }
        div.field { color: var(--primary); text-transform: uppercase; font-size: 12px; margin-bottom: 4px; }
        div.form-row { margin-bottom: 14px; }
        input { width: 100%; max-width: 420px; padding: 8px; font-size: 14px; border: 1px solid #aaa; border-radius: 4px; }
        input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        p.hint { color: #666; font-size: 13px; margin: 0 0 16px 0; }
        div.actions { margin-top: 14px; }
    </style>

    <script type="text/javascript">

       // DATA MODEL

       let initial_movies = [
        { title: "Superlópez", director: "Javier Ruiz Caldera", thumbnail: "files/superlopez.png" },
        { title: "Jurassic Park", director: "Steven Spielberg", thumbnail: "files/jurassicpark.png" },
        { title: "Interstellar", director: "Christopher Nolan", thumbnail: "files/interstellar.png" }
    ];


        localStorage.my_movies = localStorage.my_movies || JSON.stringify(initial_movies);


        // VIEWS
        // Escapa el texto del usuario para que no rompa el HTML (comillas, <, >, &)
        const esc = (t) => String(t === undefined || t === null ? "" : t)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

        const indexView = (movies) => {
            let i=0;
            let view = `<div class="toolbar">
                            <button class="new">Add</button>
                            <button class="reset">Reset</button>
                            <span class="count">${movies.length} movie(s)</span>
                        </div>`;

            if (movies.length === 0) {
                view += `<div class="empty">There are no movies. Press <b>Add</b> to create one or <b>Reset</b> to restore the original list.</div>`;
            }

            view += `<div class="movies">`;
            while(i < movies.length) {
              view += `
                <div class="movie">
                   <div class="movie-img">
                        <img class="show" data-my-id="${i}" src="${esc(movies[i].thumbnail)}" title="View details" onerror="this.src='files/noimage.png'"/>
                   </div>
                   <div class="title">
                       ${esc(movies[i].title) || "<em>No title</em>"}
                   </div>
                   <div class="actions">
                       <button class="show" data-my-id="${i}">view</button>
                       <button class="edit" data-my-id="${i}">edit</button>
                       <button class="delete" data-my-id="${i}">delete</button>
                    </div>
                </div>\n`;
              i = i + 1;
            };
            view += `</div>`;

            return view;
        };


        const editView = (i, movie) => {
            return `<h2>Edit Movie</h2>
                <div class="card">
                <p class="hint">Change the data of the movie and press <b>Update</b> to save it, or <b>Back</b> to cancel.</p>
                <div class="form-row">
                <div class="field">Title</div>
                <input  type="text" id="title" placeholder="Title"
                        value="${esc(movie.title)}">
                </div>
                <div class="form-row">
                <div class="field">Director</div>
                <input  type="text" id="director" placeholder="Director"
                        value="${esc(movie.director)}">
                </div>
                <div class="form-row">
                <div class="field">Thumbnail</div>
                <input  type="text" id="thumbnail" placeholder="Thumbnail URL"
                        value="${esc(movie.thumbnail)}">
                </div>
                <div class="actions">
                    <button class="update" data-my-id="${i}">
                        Update
                    </button>
                    <button class="index">
                        Back
                    </button>
                </div>
                </div>
               `;
        }


        const showView = (movie) => {
            return `<h2>${esc(movie.title) || "<em>No title</em>"}</h2>
             <div class="card detail">
                <img src="${esc(movie.thumbnail)}" onerror="this.src='files/noimage.png'"/>
                <div class="info">
                    <p>
                        <div class="field">Title</div>
                        ${esc(movie.title) || "<em>No title</em>"}
                    </p>
                    <p>
                        <div class="field">Director</div>
                        ${esc(movie.director) || "<em>No director</em>"}
                    </p>
                    <div class="actions">
                        <button class="index">Back</button>
                    </div>
                </div>
             </div>`;
        }


        const newView = () => {
            return `<h2>Create Movie</h2>
                <div class="card">
                <p class="hint">Fill in the data of the new movie. The title is required. If you leave the thumbnail empty a default image is used.</p>
                <div class="form-row">
                <div class="field">Title</div>
                <input  type="text" id="titulo" placeholder="Title">
                </div>
                <div class="form-row">
                <div class="field">Director</div>
                <input  type="text" id="director" placeholder="Director">
                </div>
                <div class="form-row">
                <div class="field">Thumbnail</div>
                <input  type="text" id="miniatura" placeholder="Thumbnail URL (e.g. files/noimage.png)">
                </div>
                <div class="actions">
                    <button class="create">Create</button>
                    <button class="index">Back</button>
                </div>
                </div>`;
        }



        // CONTROLLERS 
        const indexContr = () => {
         let my_movies = JSON.parse(localStorage.my_movies);
         document.getElementById('main').innerHTML = indexView(my_movies);
         };


        const showContr = (i) => {
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = showView(movie);

        };

        const newContr = () => {
            document.getElementById('main').innerHTML = newView();

        };

        const createContr = () => {
            let title     = document.getElementById('titulo').value.trim();
            let director  = document.getElementById('director').value.trim();
            let thumbnail = document.getElementById('miniatura').value.trim();

            if (title === "") {
                alert("The title cannot be empty.");
                return;
            }

            let my_movies = JSON.parse(localStorage.my_movies);
            my_movies.push({
                title:     title,
                director:  director,
                thumbnail: thumbnail || "files/noimage.png"
            });
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };

        const editContr = (i) => {
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = editView(i, movie);
        };


        const updateContr = (i) => {
            let my_movies = JSON.parse(localStorage.my_movies);
            my_movies[i].title    = document.getElementById('title').value;
            my_movies[i].director  = document.getElementById('director').value;
            my_movies[i].thumbnail = document.getElementById('thumbnail').value;
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };


        const deleteContr = (i) => {
            if (confirm("Are you sure you want to delete this movie?")) {
                let my_movies = JSON.parse(localStorage.my_movies);
                my_movies.splice(i, 1);
                localStorage.my_movies = JSON.stringify(my_movies);
                indexContr();
            }
        };


        const resetContr = () => {
            localStorage.my_movies = JSON.stringify(initial_movies);
            // Compatibilidad con tests/checks.js, que lee la clave antigua "mis_peliculas"
            localStorage.mis_peliculas = localStorage.my_movies;
            indexContr();
        };


        // EVENT ROUTER
        const matchEvent = (ev, sel) => ev.target.matches(sel);
        const myId = (ev) => Number(ev.target.dataset.myId);

        document.addEventListener('click', ev => {
            if      (matchEvent(ev, '.index'))  indexContr  ();
            else if (matchEvent(ev, '.edit'))   editContr   (myId(ev));
            else if (matchEvent(ev, '.update')) updateContr (myId(ev));
            else if (matchEvent(ev, '.show'))   showContr   (myId(ev));
            else if (matchEvent(ev, '.new'))    newContr    ();
            else if (matchEvent(ev, '.create')) createContr ();
            else if (matchEvent(ev, '.delete')) deleteContr (myId(ev));
            else if (matchEvent(ev, '.reset'))  resetContr  ();
        })

        
        
        // Initialization        
        document.addEventListener('DOMContentLoaded', indexContr);
    </script>
</head>

<body>

    <h1 class="index" title="Back to the main page">My Favourite Movies</h1>
    <div id="main"> <!-- The view is included here --> </div>

    
</body>
</html>
